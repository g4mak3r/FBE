[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fbe-flow"
version = "0.3.0"
description = "Local, seller-isolated marketplace operations foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.142.2",
  "uvicorn==0.54.0",
  "jinja2==3.1.6",
  "pydantic==2.13.5",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx2==2.13.1", "ruff==0.16.9"]

[project.scripts]
fbe-flow = "fbe_flow.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fbe_flow = ["core/migrations/*.sql", "web/templates/*.html", "web/static/*", "integrations/chz/*.ps1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
