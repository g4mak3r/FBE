<section id="workspace-orders" hidden><div class="recent-orders-heading"><h2>Новые заказы WB</h2><a href="/sellers/{{ seller.id }}/sales?channel=wb&amp;status=new">Перейти к сборке →</a></div><div id="workspace-recent-orders" class="recent-order-strip"></div></section>
<div class="workspace-toolbar"><p id="workspace-updated" class="muted"></p><div class="actions"><button id="workspace-refresh" type="button" class="secondary" aria-label="Обновить сводку">Обновить</button><button id="workspace-configure" type="button" class="secondary">Виджеты</button></div></div>
{% if not connections %}<section class="panel empty"><h2>Подключите первую систему</h2><p>Здесь появятся задачи по заказам и маркировке.</p><a class="button-link" href="/sellers/{{ seller.id }}/settings?tab=integrations">Перейти к подключениям</a></section>{% endif %}
<div id="workspace-widgets" class="workspace-grid" aria-live="polite"><p class="muted">Загружаем задачи…</p></div>
<dialog id="workspace-dialog" class="workspace-dialog"><div class="dialog-heading"><h2>Настроить пространство</h2><button id="workspace-close" class="secondary" type="button">Закрыть</button></div><p class="muted">Выберите виджеты, каналы и порядок. Настройки сохраняются для этой организации.</p><form id="workspace-layout-form"><div id="workspace-layout"></div><div class="actions"><select id="workspace-new-kind" aria-label="Новый виджет"><option value="assembly">К сборке</option><option value="shipping">К отгрузке</option><option value="attention">Требует внимания</option><option value="codes">Коды маркировки</option><option value="documents">Документы соответствия</option></select><button id="workspace-add" class="secondary" type="button">Добавить виджет</button></div><div class="actions"><button id="workspace-defaults" class="secondary" type="button">Начальный набор</button><button type="submit">Сохранить пространство</button></div></form></dialog>
