name: FBE Flow

on:
  push:
    paths: ["fbe-flow/**", ".github/workflows/fbe-flow.yml"]
  pull_request:
    paths: ["fbe-flow/**", ".github/workflows/fbe-flow.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: fbe-flow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: fbe-flow/requirements-lock.txt
      - run: python -m pip install -c requirements-lock.txt ".[dev]"
      - name: Validate browser scripts
        shell: bash
        run: |
          for file in src/fbe_flow/web/static/*.js qa/*_browser.cjs; do node --check "$file"; done
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest
      - name: Validate CryptoPro bridge PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'src/fbe_flow/integrations/chz/crypto.ps1'),
            [ref]$tokens, [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) { throw 'Invalid PowerShell bridge syntax' }

      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: fbe-flow/qa/package-lock.json
      - name: Install browser checks
        if: runner.os == 'Linux'
        run: npm --prefix qa ci --ignore-scripts
      - name: Install Chromium
        id: chromium
        if: runner.os == 'Linux'
        working-directory: fbe-flow/qa
        run: npx playwright install --with-deps chromium
      - name: Assortment browser acceptance
        if: runner.os == 'Linux'
        run: node qa/catalog_browser.cjs
      - name: Workspace browser acceptance
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.chromium.outcome == 'success' }}
        run: node qa/workspace_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: assortment-browser-screenshots
          path: fbe-flow/qa/artifacts/
          if-no-files-found: ignore
          retention-days: 7
