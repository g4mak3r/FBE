name: Assortment verification

on:
  push:
    branches: ["feature/fbe-assortment-stage7"]
    paths: ["fbe-flow/**", ".github/workflows/fbe-assortment-check.yml"]

permissions:
  contents: read
  actions: write

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fbe-flow
    steps:
      - name: Stop obsolete benchmark run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          import urllib.request
          import urllib.error
          req = urllib.request.Request(
              "https://api.github.com/repos/g4mak3r/FBE/actions/runs/37357519808/cancel",
              method="POST", headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                                     "Accept": "application/vnd.github+json"})
          try:
              with urllib.request.urlopen(req, timeout=10) as response:
                  print("Obsolete benchmark cancellation:", response.status)
          except urllib.error.HTTPError as error:
              print("Obsolete benchmark no longer active or cancellation unavailable:", error.code)
          PY
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -c requirements-lock.txt ".[dev]"
      - name: Prepare formatting feedback
        run: |
          python -m ruff check . --fix || true
          python -m ruff format .
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          root = Path(subprocess.check_output(["git", "rev-parse", "--show-toplevel"], text=True).strip())
          changed = subprocess.check_output(["git", "diff", "--name-only", "--", "*.py"], text=True)
          for name in changed.splitlines():
              text = (root / name).read_text(encoding="utf-8")
              for index in range(0, len(text), 4000):
                  print("FBE_FORMAT " + name + " " + str(index) + " " + json.dumps(text[index:index + 4000], ensure_ascii=False))
          PY
      - name: JavaScript syntax
        run: node --check src/fbe_flow/web/static/catalog.js
      - name: Python lint
        run: python -m ruff check .
      - name: Full regression tests
        if: always()
        run: python -m pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser checks
        run: |
          npm --prefix qa install --ignore-scripts
          python -c 'import json; from pathlib import Path; print("FBE_FORMAT fbe-flow/qa/package-lock.json 0 " + json.dumps(Path("qa/package-lock.json").read_text()))'
      - name: Install Chromium
        working-directory: fbe-flow/qa
        run: npx playwright install --with-deps chromium
      - name: Large assortment roundtrip
        run: python -m qa.catalog_benchmark --count 30000
      - name: Browser acceptance
        env:
          FBE_QA_EMIT_IMAGES: "1"
        run: node qa/catalog_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assortment-browser-screenshots
          path: fbe-flow/qa/artifacts/
          if-no-files-found: ignore
